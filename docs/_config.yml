# GitHub Pages configuration for the WeGA WebApp documentation.
# Rendered by GitHub's built-in Jekyll; no local build needed.
# Enable in the repository settings: Pages → Source → "Deploy from a branch",
# branch `main`, folder `/docs`.

title: WeGA WebApp
description: Documentation for the web application of the Complete Works of Carl Maria von Weber
url: https://edirom.github.io
baseurl: /WeGA-WebApp

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme

search_enabled: true
heading_anchors: true

aux_links:
  GitHub: https://github.com/Edirom/WeGA-WebApp
  weber-gesamtausgabe.de: https://weber-gesamtausgabe.de

footer_content: 'Documentation of the <a href="https://github.com/Edirom/WeGA-WebApp">WeGA WebApp</a>, BSD 2-Clause / CC BY 4.0.'
