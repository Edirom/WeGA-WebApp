#  dtsEntrypoint schema
type: object
properties:
  "@context":
    type: string
    format: uri
    default: "https://distributed-text-services.github.io/specifications/context/1.0rc1.json"
  "@id":
    type: string
    format: uri
  "@type":
    type: string
  dtsVersion:
    type: string
  collection:
    type: string
  document:
    type: string
  navigation:
    type: string
required:
  - "@context"
  - "@id"
  - "@type"
  - "dtsVersion"
  - "collection"
  - "document"
  - "navigation"
example: |
  {
    "@context": "https://distributed-text-services.github.io/specifications/context/1.0rc1.json",
    "@id": "https://weber-gesamtausgabe.de/api/v1/dts",
    "@type": "EntryPoint",
    "dtsVersion": "1.0rc1",
    "collection": "https://weber-gesamtausgabe.de/api/v1/dts/collection{?id}",
    "document": "https://weber-gesamtausgabe.de/api/v1/dts/document{?resource,ref,start,end}",
    "navigation": "https://weber-gesamtausgabe.de/api/v1/dts/navigation{?resource,ref}"
  }
