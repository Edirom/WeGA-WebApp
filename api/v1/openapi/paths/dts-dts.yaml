# DTS main entrypoint endpoint
get:
  tags:
    - DTS
  summary: Distributed Text Services API Entrypoint
  description: |
    Entrypoint of the WeGA DTS implementation (see specification 
    <https://dtsapi.org/specifications/versions/v1.0/#entry-endpoint>).
  responses:
    '200':
      description: |
        Information about the DTS implementation containing URI templates of 
        the "collection", "navigation" and "document" endpoints.
      content:
        application/ld+json:
          schema:
            $ref: '../schemas/dtsEntrypoint.yaml'
